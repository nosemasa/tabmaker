  <script>
    const rawMarkdown = "# 🎸 TabMaker (タブメイカー) PWA・Web版 使い方マニュアル\n\nTabMaker（タブメイカー）は、ギタリストやバンドマンのための**直感的で美しいギタータブ譜作成・共有アプリ**です。  \n**PWA（プログレッシブ・ウェブ・アプリ）版**なら、面倒なインストーラーのダウンロードやセキュリティ警告画面は一切なく、**Windows・Mac・Android・iPhone・iPad** のどの端末からでも URL を開くだけですぐに利用でき、デスクトップやスマホのホーム画面に**専用アプリアイコン**として追加できます。\n\n---\n\n## 🌐 アクセスURL（全端末共通）\n\n👉 **https://nosemasa.github.io/tabmaker/**\n\n- **セキュリティ警告ゼロ**: `.exe` や `.apk` をダウンロードしないため、Windows や Android のセキュリティアラートが一切出ません。\n- **自動アップデート**: アプリが更新されると自動的に最新版が反映されるため、再インストールの手間がありません。\n\n---\n\n## 📑 目次\n1. [パソコン・スマホに「アプリ」として追加する方法 (PWA導入)](#1-パソコンスマホにアプリとして追加する方法-pwa導入)\n2. [全体画面の構成](#2-全体画面の構成)\n3. [上部固定バーの操作ガイド](#3-上部固定バーの操作ガイド)\n4. [曲名プロジェクトの保存・複製・端末間共有](#4-曲名プロジェクトの保存複製端末間共有)\n5. [タブ譜の入力・編集手順](#5-タブ譜の入力編集手順)\n6. [スタンプ機能（記号・注記）の使い方](#6-スタンプ機能記号注記の使い方)\n7. [セクションの管理と並べ替え](#7-セクションの管理と並べ替え)\n8. [バンド共有・ファイル出力（スプレッドシート・PDF）](#8-バンド共有ファイル出力スプレッドシートpdf)\n9. [スマホ・タブレットでの快適操作ガイド](#9-スマホタブレットでの快適操作ガイド)\n10. [ショートカットキー＆操作一覧](#10-ショートカットキー操作一覧)\n\n---\n\n## 1. パソコン・スマホに「アプリ」として追加する方法 (PWA導入)\n\nブラウザでお気に入り（ブックマーク）に登録して使うこともできますが、以下の手順で**「アプリとしてインストール（ホーム画面に追加）」**すると、デスクトップやスマホのホーム画面に **TabMaker のギターアイコン** が作成され、アドレスバーのないスッキリした専用ウィンドウで起動できます。\n\n### 💻 Windows / Mac パソコンの場合（Chrome / Edge）\n1. Google Chrome または Microsoft Edge で **`https://nosemasa.github.io/tabmaker/`** を開きます。\n2. アドレスバー（URL入力欄）の右端に表示される **「アプリをインストール」アイコン（モニターに下矢印のマーク）** をクリックします。\n   - ※アイコンが見当たらない場合は、右上のメニュー「**⋮**」または「**…**」→「**キャスト、保存、共有**（Edgeの場合は **アプリ**）」→「**TabMaker をアプリとしてインストール**」を選択します。\n3. 確認画面で **「インストール」** をクリックします。\n4. デスクトップやスタートメニューに **「TabMaker」** アイコンが作成され、次回からはアイコンをダブルクリックするだけで専用アプリとして起動します。\n\n### 📱 Android スマートフォン・タブレットの場合（Chrome）\n1. Google Chrome で **`https://nosemasa.github.io/tabmaker/`** を開きます。\n2. 画面右上のメニューボタン **「⋮」** をタップします。\n3. メニュー内の **「アプリをインストール」** または **「ホーム画面に追加」** をタップします。\n4. 確認画面で **「インストール」** をタップすると、スマホのホーム画面に **TabMaker** アイコンが追加されます。\n\n### 🍎 iPhone / iPad の場合（Safari）\n1. Safari で **`https://nosemasa.github.io/tabmaker/`** を開きます。\n2. 画面下部（iPadは画面上部）の **「共有」ボタン（四角から上向き矢印 📤）** をタップします。\n3. メニューを下にスクロールし、**「ホーム画面に追加」** をタップします。\n4. 右上の **「追加」** をタップすると、ホーム画面に **TabMaker** アイコンが追加されます。\n\n---\n\n## 2. 全体画面の構成\n\nTabMaker の画面は、常に最上部に固定される**「上部固定バー（メインヘッダー＆サブツールバー）」**と、その下に広がる**「メイン編集キャンバス」**で構成されています。\n\n![TabMaker 全体画面](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABQAAAANcCAIAAACPGpUWAAAQAElEQVR4nOydBYAdxf3HZ/bpucTdjRA3CCRAcEJwL05Di/5bWmhLgZYixUpbtC2F0lIo7hoSIEFjEHf3k5zbs53/b3ZWZvfte/fOL3e/D4/Lvt3ZsZU33/n9Zsbbf/iRBEEQBEEQBEEQBEE6OgpBEARBEARBEARBkE4ACmAEQRAEQRAEQRCkU4ACGEEQBEEQBEEQBOkUoABGEARBEARBEARBOgUogBEEQRAEQRAEQZBOAQpgBEEQBEEQBEEQpFOAAhhBEARBEARBEATpFKAARhAEQRAEQRAEQToFKIARBEEQBEEQBEGQTgEKYARBEARBEARBEKRTgAIYQRAEQRAEQRAE6RR4GxKYJvlmwer5jiAIgiAIgiAIgiCtTyoCmDr+JQm+G7vtipeZwVAJIwiCIAiCIAiCIG1GcgFMzT/iK4076IKleDXJa+phfT/KYARBEARBEARBEKQNSCSAZelr6F77P1zQxmtgJluANckr/hBjf2IZfMS0iV3ycpl2kEnxwf/7DhSsWrWWJOCoo4845phjQuHwSy/+b/++A/EBPF7P4WPH5eTkhkN1P/zwfai2Lj7MgMFD+vYbEIlG1q1eWVVRQRKTnpk5+/zL0jOztm1a/+Un7xEEQRAEQRAEQRDkUMBVAFM36UvNLX0/5f8y22lEUsBM28GIEMGmArZksFMD/+yGq6dNncg09asyAIJqfxl7572PkwjgoUOHnnn2GXV1offf/9BVAPv8/suvvnrs+AkQ84v//td//vksxCkHGDbysN89/Of0jMxQXej2n12XXAD7/cFpx5yY17W71+9HAYwgCIIk9ok6hGi6f1YHqIRWA2u7uWhyTR5aFdmcbpStWXJ0/0TaFw4BHGf4Ff/rxl5KueLl2pXxDeZ4eDR9q/3H5aXC/+EbTDudCRnMTFUcbwqmlBrSWEQj0mX1PaJ6pmmyYDxuLcKLLrti25atX37+uXkoPTPj8rk/yczMZCk+nlInAIIgCNIpoSnuOwTQf/uo696kdKBKaDWwtpuLRtckddk6ZNCzbI4ubMA5bVpce9rMZQtBWhNZAFPpD5WlL9e9mt5ThSimihDDthOtpxEUK9O0rwhBhSAWMphqetgUwoRYpuCLLrtBbJxw3NFPP/kQnHPdjbct+PwrUh+6wTmpfmXCskyYQpXr/u9nWzZv3r9nj5Y5+qMrfzx24mSVpfwUMqOYCIIgSKfD0Zo89CVIXFe28etMEjdPO1wltBpY281FI2oyvgIderK9Y7haWreEWfAEgV3UPkuwv4VwaHUzV0z/yuzBEKRVsFuAhbw1NnSzKhXWW4FCDFlrmECp9LZhxpbu+UyYajgbW0KXy2DTJzrJO8r+SGZkZfzkx1ecd95ZYKoFsbp27fo//fnxH5av5E7SRn6mTp1y1+/uHDh4MKS5e+/eZ57628LPP4/FVCJZgCHR/C7dbv7FrffceXtNVfX0Y46dfc55erGZ5OpN6cix4350zfVDRo6G2OrqQvPefe2dl/9TW12tF12yAI8/cuZ5V91EPZ6CvbtfeOy+0uLCbn36nXPV/40YN40oihpTl37x4SevPltWXAiBT7/ipsOmHrdz0+o1330269wfZ3Xp/q/7bt6/bSNBEAQ5ZPEFM73+DI8vwIjn0P と「+省略セクション」の間に配置されています。6弦TAB譜面を省き、**トップの行（セクション見出し）＋ コード入力の行（デフォルト1行・4小節）＋ ボトムの行（セクション末尾テキスト）** で構成されるコード進行専用セクションを追加します。\n- **+省略セクション**: 小節を持たない**セクション名とセクション末尾テキストだけのカラーバー（省略セクション）**を追加します（例：1番と同じフレーズを繰り返す2番の「aメロ」「サビ」などを、譜面を省略して構成だけ明記したいときに便利です）。\n- **📤 出力 ▾**: クリックすると出力メニューが展開します。\n  - **📊 スプレッドシート用出力**: Googleスプレッドシート・エクセル完全互換の `.xlsx` ファイルをダウンロード保存します。\n  - **📄 PDF出力 / A4印刷**: A4サイズ（縦・横対応）の印刷用楽譜としてプレビュー・PDF保存します。\n- **💾 保存**: 現在入力されている曲名で、お使いの端末（ブラウザ/PWAアプリ内ストレージ）にプロジェクトを即座に保存します（ショートカット `Ctrl + S`）。\n- **📁 プロジェクト ▾**: クリックするとプロジェクト管理メニューが展開します。\n  - **📋 プロジェクト一覧**: これまでに保存した楽曲の一覧モーダルを開き、曲の切り替えや管理を行います。\n  - **📑 複製**: 現在開いているプロジェクトを複製（別名コピー）してそのまま開きます。アレンジ違いや別バージョンの作成に便利です。\n  - **📄 新規作成**: 白紙の新しいタブ譜を作成します。\n  - **🎵 サンプル曲**: サンプル曲「壊れた空」を読み込みます。\n- **❓（ヘルプ）**: 使い方と共有方法のガイドモーダルを開きます。\n- **📁 出力先フォルダ**: 「❓」ボタンの右隣に配置されています。PWA・Web版では、出力したファイルはお使いの端末の標準 **「ダウンロード」フォルダ**（PCでは `Ctrl + J` で履歴表示可能）に保存されます。\n\n### サブツールバー（下段）\n- **スタンプツール**: 配置したい記号チップをクリックして選択（またはドラッグ）します。\n\n---\n\n## 4. 曲名プロジェクトの保存・複製・端末間共有\n\n複数の曲を並行して作成・管理できるよう、曲名ごとのプロジェクト保存・管理機能を備えています。\n\n![プロジェクト管理モーダル](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAqgAAAEYCAIAAAAf+JPjAAAQAElEQVR4nOydB2AUVf7H3+xudje9NyAkQOgk9CK9K4IIoqKACiJ6ep6enqeevbc7+6l/9ewdRURBkS5I7733EtJ7sn3+35m3O5nsbjabZEPL7+O4vJ1582b2zWa+v/Lmra5f/4FMRhRF5kIpi0xjY0abGGwX9EzQSgsTGEEQBEEQFwoiE+1YtKJFK1TqmEnAW2ktE4QqyVbKOlaD5DsEvdkRbteGlRfnmipy7Faz3W5jqpoEQRAEQVwQCIJWq9MGGYwh4aGRKVp7qV4oE0Qz13Qu+UpZV+Xcq0TdxKKtYmhR3ilTxVESe4IgCIK4oBFFu82KxVJZVlJw1hgSERXfQsfKDKyQqSRflMs60bmLU93tLMjE4sqKC0qLjpPkEwRBEMRFhiiayovPVpSER8WHRTQzsDwtszAu9LLrr2Eu1cernelNQmJ+9qnSwhxSfYIgCIK4WBFFSHl+zimzJtHODE73Xn7VKKrvkFQ/Ie/MEQQKGEEQBEEQFzkQdMi6WZMAiVe0v8rjNwlx+WePW82VjCAIgiCISwLIOsTdLMRD6R0OSfCdHr9ZiEZen3x9giAIgrjEgLiXlRRYhRgmu/qS8NvFIBsLKy3KZQRBEARBXHJA4m1CmIMFMZ7jtwkRRbmnaDQfQRAEQVyaiCKE3iZEigweP9PateGmihJGEARBEMQlCoTeoQuHw6+xC8Hlxbnk7hMEQRDEpYwoQu7tQojGIQSbKkoZQRAEQRCXNJB7BwvWOZjBbjUzgiAIgiAuaSD3DsGgYxqt9Os7BEEQBEFc0khyr9HqpF/apQQ/QRAEQVzySNP1Q/iZwAiCIAiCaBIIGkYQBEEQ 保持され、曲名に自動で ` (コピー)` が付いた新しいプロジェクトとして複製・保存され、そのまま編集画面で開かれます。\n\n### ③ プロジェクト一覧から曲を切り替える\n1. ヘッダーの **「📁 プロジェクト ▾」** → **「📋 プロジェクト一覧」** を選択します。\n2. 保存した楽曲がカード形式で一覧表示されます。切り替えたい曲カードの **「開く」** ボタンをクリックすると、瞬時にその楽曲へ切り替わります。\n\n### ④ 別のパソコン・スマホ・バンドメンバーへ曲データを渡す（ファイル書き出し＆読み込み）\nPWA版では、曲データをファイル（`.tabmaker`）として書き出して、他のメンバーや自分の別端末（PC ⇔ スマホ）へ簡単に受け渡しできます：\n- **💾 書き出し（ダウンロード）**: 「📋 プロジェクト一覧」内の各曲カードにある **「💾」ボタン** を押すと、その曲のプロジェクトファイル（`曲名.tabmaker`）が端末の「ダウンロード」フォルダに保存されます。これを LINE やメール、Googleドライブで共有します。\n- **📂 読み込み（復元）**: 受け取った端末で「📋 プロジェクト一覧」上部の **「📂 ファイルから開く」** ボタンを押して `.tabmaker` ファイルを選択すると、そのまま曲データが読み込まれて編集・再生できます。\n\n---\n\n## 5. タブ譜の入力・編集手順\n\n小節カードは、ギタリストが最も直感的に音符とコードを入力できるように設計されています。\n\n![小節カードの詳細構造](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASsAAAD0CAIAAABM2ZetAAAQAElEQVR4nOydCWAU9b3Hf3sfyWZzh9wkIEnQBIgKHhiqQrRaFLX4kEqlarwq1qditVqfB7WtFKvGij6ohsehrxE8IrYkIA+EmqBcieQAQiSQhNy7Sfa+3n93Q1xybHZ2s7vzn/19xGRmMrszv//Md37/+f//8x2hzmDS6owdvRqNTm+z2QBBEH/C4/HCZNK4SLlcJrbPdqs0YXIJIAgSKJypTqM1AA/4Hb0DgCBIwGnv6e9SaYQanQEQBAkUzgRIfhLpCfh8Id77IUhQsFmtVh6PDwiCBA8h0E9nb7+6X683mriRz0lbmVQsUiqkcVEKN6uFZtTcwOYE7AeObgUaTebmtl6ZVJSWGBUuE5OjCPRDDs2AztjZO3CyuZPEJRYNP0ahGTU3GHm5pDtOciLGRMonxUQAhyCKUsgl5N+57j4S4NS0uGErhGbUXIXi+0BSDSN5gGMnoiskNBIgCdN1YWhGzWEoViC5C4qLCgdOQwIkYbouCc2oOQzFCiSNEOGOcT0XoGk+VN2sdU73ntpX22qyAr2QAEmYrktGjbqrtVlrdkxpOpq7qO/gHRk1h6H4PpDc1F7QCKFrPfR9q7bneOnOjrSfzJ0TD20H95V3JWlvyJTLkvIvSZIDfZAAh927D4+acG7XW2/WxC4puiehfd/n28ol1z8zs2l9ddr991yWCFQyMmoOw6H+QGN3Y31zTYc0Oy9N3tNcU9/cFZaWny60L2zq5uwV1dxcuvGwetq8e6Y3b3l326en05b+pGftR83KvBxK5RdqBCEHmsxWrd5ImtQZXebIdZ+0UMtJn5FwjKuGMkHZ/39VXYNzsQU3FvbXdOVl1L+9C5bergSO0nGiMXruIumeZz+6/s3f3rzhr9vXv9OceHmOduuWTxOKFiUBwnICrUAiP1W/1osqBvmIwWgmuo1UyMcQoVnbb4Bp1z88B3Zv3tWoG2iuPdWckuHJl+uNZpPFNlbNh1SKRALSX+xrWbnfipcbSrr+mZ/uePavkinTv3t2zYBJZ1/W9m0d+dm4cUf+yhvS+F7uD6uj5hCBDptkP19q+OSz5BuU4dKxVlB/v2/tcdBqwPOkR04Ro9nqdqM2o5nstNmXs2TcrXi5IWvrp5truiBt0bKbE6s+W/NpqzwlLTtaCFa1Kfky9/KjOGq20t6pOv5Da2unSjNgvxaGhcuS4iKnTU5KiIsc6yOBjpkkMfAN998gUsZMmQRtDa2e3 節間の隙間をなくし、前半・後半の分割数に応じた比率と最適な文字サイズで、1行あたり**4小節（4小節/1行）**の標準サイズ内に最大16個（2桁数字含む）まですっきり収まります。\n  - **前半＋後半の合計が17分割以上**: 自動的にその小節カードの横幅が**2倍に拡大（2小節/1行）**され、高密度なフレーズも重ならずに見やすく表示されます。\n- **小節中央の極薄ドット補助線**:\n  - 1小節の前半と後半を分ける縦線は、小節線と見間違えないよう**「繊細な極薄ドット点線（dotted）」**で表示されます。\n\n### ③ コードネームの直打ち入力と上書き編集\n- **新規コードの追加**: TAB面の上にある **コード行（水色の枠エリア）** の好きな位置をクリック（タップ）すると、コード入力モーダルが開きます。\n- **コードの上書き・修正**: 配置されたコードタグを **タップ（またはクリック）するだけ** で、専用のコード編集画面が開きます。\n\n![コード入力・編集専用モーダル](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbgAAAF8CAIAAAAy0TlGAAAQAElEQVR4nOzdCWAU1f0H8DezV+6QhCSEIwkQQwQBD0A5PBAEq1aUWqFqlVJtvWpr1daz1opWW1tbq60tLX+wHlhvRUWI4sGhgMohGEI4Eo5cQO7sZo+Z/29mdmdnN7uZzWZ3s0m+H2PYnZ2dfbvZfPN7783sGM8591zmRwy2oNMNblzgxd1cPThR/ea7SL0iMm0jxYCXfVrAcZq2yFc4zXWm20bO559ODQq2fneJugs6vzhikKZwfv96L3JioDuLrPNrGaQpouZ2UfphSN9EWefLzPvz8jy+9AOQvnEKpl5yX1V+QOo/zP9HFNKrywVstd+T9LRQe4Hp/3DD+PFygf4P9U3IBb0SUSEGgdit3z2F9jeQY51+G4PeLeiVroj+j6v9gXPu97/8fhRdgsAYzxs4Wqi9iRkDbtnJjHYhISF5sM3BrDZH1++TPkkMchnCwAW5HFmi5nuMRelJDeQ3odjpQu+hH29iginBxGxtx8281cA5Oq/jH5RO0cgsuTaHYfzJw5MSDNZ2q81mVf+6AgD0M1RmJiQkJiYlttuG7txzOMHoZB11Bs6pXcdQUFioXukQUlpcWZMnFqWYXU67zWq1Op0OBgDQr1HQSXHnsA1Ot+Tnj9h7xM5zglFTWnqDst2VmpiWd/rYoU0NJxgAwIBks7afNHJIY7uh3eYwc3ZlIa/8Q7VkUtqQUcPSmxobGQDAAEYxSGGYmDakQ0xRhqiloHSJxlZXesmobKu1nQEADHgUhiePyqZgpHhkSlCKltwZk4pQSwIAqCgSKRhZQi5d5ikvaY67qeEYAwAADQpGikeXaOI7hMTxY4ZjByAAAD8UjBSPHWICn5CclZRgYAAA0AnFY0JSllE69qbdygAAoBPpoBsHZ6RvNhuCEgAgAIpHW4fDKGqO/wcAAC3l81x4BgAAXUJQAgDoQFACAOhAUAIA6EBQAgDoQFACAOhAUAIA6EBQAgDoQFACAOhAUAIA6EBQAgDoQFACAOgwsijjOCMvWjjBYmAmxhkTE5IbO8pZv5M3JOeOX/zU4XCueP6Vsj0VId7r1psWnTbxlN1le99etSYnZ/B1V1/RbrVt3LTlf6+tYgAQNyIelJzJmccLZo7neYpIzmwyGg1GCc8bGMcE0cU6WG8ZN3bMLTdel5kx6ERD4zPPrti1e8+VV3x3xtTJq9d+fNHc8zd+vvXFl99kYZl57rQhudnbd35LKXn29DMXL1qQmJDQeTWn00mZqOTgtLMmnTphXHJyUm5Odmtr2/nnTU9NTTGbzY1NzQwA4kmEg9IgJmekDDfyJvkUj52IVGAGvuMTjz0wfFge65KabixyjhytSUpKLBpd2NrWNmH8yW+8tdpqs2lXuOSi2WdPn0JZZrGYOY5zuYTW1laqAdd++Nnub92l8V233zhhwtij1bVffb3jP88+cbDy0I9u+GXXj0tP9rJL56akJNPl/BFDn/z ードが上書き更新されます。\n- **安全な削除**: モーダル左下の **「🗑️ 削除」** ボタンを押すことで、そのコードを安全に削除できます。\n- **タイミング位置の移動**: コードタグを指やマウスで左右にスライド（ドラッグ）することで、小節内の好きなタイミング位置（0%〜100%）へ自由に微調整できます。\n\n### ④ 小節の移動・並べ替え・コピー＆ペースト\n- **小節の移動**: 左上の「**⠿**」マークを掴んでドラッグし、移動したい小節の前後にドロップすると順番が並べ替わります。\n- **📋 コピー / 📥 貼り付け**: 小節上部のコピーボタンで記憶し、別の小節の貼り付けボタンで直後に挿入できます。\n- **🎨 カラー変更**: 丸いカラーボタンからキメ小節や転調小節を色分けハイライトできます。\n- **🗑️ 削除**: ゴミ箱ボタンで小節を削除します。\n\n---\n\n## 6. スタンプ機能（記号・注記）の使い方\n\n演奏記号や注記を、譜面上の自由な場所へシールのように貼り付けられます。\n\n![スタンプの選択と変形ハンドル](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAASsAAAD0CAIAAABM2ZetAAAQAElEQVR4nOydCWATZfr/n0zOpk3T+z5oC7QFWmpFQMGyyuHBoqDiIsqK6+K14rIreLL+VkV3FXHRsiA/UMufQ7QgKqJCQX4gaItyFWkpUAotvds06ZE21+T/TtLWkKZpZtI0eZP3Yywzkzcz7/POfOd5r3lG0NGpaWppO1V6uaZeYTDQQCAQXAmfT8VEhoxNSwwLlvEQV2qaIsOCgEAgDBVGoxH9rW9SSv0k1MnSy0AgEIack6UVCpWaqq1XAIFAGCrMDhD9ra1vQW1AAWn7EQhuQa830EYjBQQCwX0IAH8aW9pUbV1dWp3Zv+MO6h6TiIRymSQ8WGYnmW9a7R0YTYDpxOGtQK1OX1nb4icRJkQHB/iJ0FkE/EHnpr1T29jSfrGyEdklElqfI9+02jvoe7vE2050IYYGSaNCA8GLQIqSScXoU9fcigwcnhBulcA3rfZWMG4HomoY8gNediFagkxDBiIzLTf6ptVeDMYKRK2g8OAA8GqQgchMyy2+abUXg7ECUScEagVZb+2oPFFcqTYvt1w6UlKjw3m0BRmIzLTcYtPqpppKtd601NFQ2aQBzOlrtReDcTsQNWqv6YTorDnxa41acT5/f0PC7yZPiIDa40f2NcWob0uW+sVkj4mRAn4gA63a7tZWI+oOvP/embB5ix6OrD/y1ef7xFNfyKrYWJzw54fHRQOW9LXai/Gi8UBtc/m5yjMNkrTMBKmi8sy5yib/hOxEAbOxotlr76j6yvzNJ1Ujpzw8qnLbB59/cSVh/u8U67ZXyjPTMZWfr+EGH6jT0+ouLepSZ3WbQ/d91EMtRWNGgn7uGvJIedv/FTV1r4Xl3D6j7UxTZtK5NQdg/j1y8FIaLpSHTJ4tOfTi9qnvPT9z03/2bFxbGX1Dunrnti8iF82OAYKHM9QKRPJTtqk5VDHQTzRaPdJtkEzajwj16jYNjJz65AQ4uPVAeWd7ZcmlyrgkR3bepdXrDMb+aj6oUiTko/FiZ8vK/lE4Hihm6gt37H3xP+KUUb+8uKpd18lsq/25FP0t37w3e9ltCRTH/Hi01V7EUJuNvJ8zNXz0W7QHeYCkvwSqX4+sOw/qDnDc6aFLRKun7R7UqNWjTOuduUoGPArHA9E1X2w90wQJsxfMjC76ctUXNdK4hLQQAdAqXew4+/LD2GpPpb5Ref5yTU2jsqOduRf6B/jFhAeNHBYTGd7vA4BDbTNyYuAc9vcglIemREFtWY3jDT90h3YwmQS44+BR2B5I9dP+fW0CIfJ7P+7ctrtBDf7ZY5PTFGfyf1KlZUqcz49nWu2BoPvI0ePnKmubE5Pis28YFuDPdPy1d6gb6hsPFP6aEB066fo0m7OXWPbEtFfs/er/tu4vVzIrnRcPH9381U/Ha1j09zvfxWV/D9KQmIy0mDCmu16SMCo5LQQc2KFDeXKyd87 節追加」「📥 小節貼付」で2行目・3行目へとコード行を増やせるほか、各小節にマウスを乗せると小節のコピー・削除ボタンが表示されます。\n- **省略セクション（セクション名＆末尾テキストの1行バー）**:\n  - **「+省略セクション」** ボタンを押すと、小節を持たない1行のカラーバーを追加できます。\n  - 通常のセクションと同じセクション名リスト（カスタム自由入力含む）、左端の**ドラッグ移動ハンドル（⠿）**、右側の**カラー変更ボタン（丸アイコン）**、**セクション末尾テキスト入力欄**（カラーボタンと削除ボタンの間）、および**削除ボタン（🗑️）**を備えており、スプレッドシート出力やPDF印刷でもそのまま出力されます。\n- **セクション移動・カラー・コピー**: 左上の「**⠿**」でセクション順の並べ替え、右側の丸ボタンでカラー変更、コピーボタンでセクション全体の複製が可能です。\n- **末尾テキスト**: セクション右下（省略セクションではバー右側）の入力欄に `D.S. al Coda`, `Fine` などの注記を記載できます。\n\n---\n\n## 8. バンド共有・ファイル出力（スプレッドシート・PDF）\n\n作成したタブ譜は、エクセル/スプレッドシート形式（`.xlsx`）や印刷用PDFとして出力し、バンドメンバーに瞬時に共有できます。\n\n### 📊 1. Googleスプレッドシート用出力 (.xlsx)\n1. ヘッダーの **「📤 出力 ▾」** → **「📊 スプレッドシート用出力」** をクリックします。\n2. エクセル完全互換（6行のTAB線、上部のコード行、セクション外枠、セル背景色、スタンプ画像を含む）の `.xlsx` ファイルがお使いの端末の **「ダウンロード」フォルダ** に即座にダウンロード保存されます。\n3. **Googleドライブへのアップロード**:\n   - 完了画面の **「☁️ Googleドライブを開いてアップロードする」** をクリックし、ダウンロードされた `.xlsx` ファイルを Googleドライブ にアップロードします。\n   - ダブルクリックで開くと **Googleスプレッドシートとしてそのまま起動** し、リンクをバンドメンバーに送るだけで、PC・スマホから全員でリアルタイム閲覧・共同編集が可能です！\n\n### 📄 2. PDF出力 / A4印刷プレビュー\n1. ヘッダーの **「📤 出力 ▾」** → **「📄 PDF出力 / A4印刷」** をクリックします。\n2. 印刷設定モーダルが開きます。\n\n![PDF / 印刷設定モーダル](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAfQAAAIWCAIAAAAu0OjJAAAQAElEQVR4nOydBYATx9vGZ3PJuXDOAQeHu7sXCpRCi7QUqFFvqdN/3b2l8tVdKTWoUGgLpWiLFnf3Q07hXCP7PZtJJpuNXM7gCO+v6bHZnZ2VzD7zzDuzu/rIJv2YBlkWk5JOFxIcGhwUbDAEBugDdLoAzGMEQRDE2Ua2WMxmk9loLC8tKy0pLcZ3x0JJq8x6l9Vtyq43BEaGR4aGhRfkZpXkZxYay5CrWvcJgiCIs4okBcBlG4ICQyJiGjQuLirML8w3GcuVRRBnZ32XHM5dJdxRUdFhYeF5WSdKi/NJ0AmCIOockhQcGhkV36ioqDAvL0c9n/8bEFQvWS3fMOzxcYnG0oKcjGOm8lJGEARB1ElMxrKivGzEzOtFJ5SVlyFo41gGjx8U1Uh8DQwKgrLnZR0vLcxhBEEQRJ3HWFpkMpbGJTSEvpvNDn3XiSm93hAXm3Am7XB5SSEjCIIgzhMg2pBuCDhkXMy0ibvM5NiYeIRijGUljCAIgjivgHRDwCHjEHM+RxF3fKkXFQPpJ89OEARxngIBh4xDzLm+6/CPQR8YFhZelJfFCIIgiPMWyDjEHJIOYVece2R4ZF7WCRrySBAEcX4jyxBzSDomdTpJFxoeoYxnJwiCIM5zIOaQdAh7QL36rczlxeUlBYwgCILwAySdFKDXhQSFkLITBEH4DZB0CLvOEBhkNpYxgiAIwi+ApEPY9QH6AOWJYARBEIRfAEmHsOuVp/jSOBmCIAi/QZYh7Hp6PjtBEITfIekYQRAE4XeQuBM
